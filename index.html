<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatterly</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bubble: #2563eb;
      --bubble-text: #ffffff;
      --other-bubble: #ffffff;
      --danger: #dc2626;
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --bubble: #2563eb;
      --bubble-text: #ffffff;
      --other-bubble: #1e293b;
      --danger: #f87171;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .logo {
      width: 75px;
      height: 75px;
      border-radius: 22px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-size: 34px;
      font-weight: 800;
    }

    .login-card h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--muted);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .google-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      transition: .2s;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .google-icon {
      margin-right: 8px;
      font-size: 18px;
    }

    .status {
      min-height: 22px;
      margin-top: 15px;
      color: var(--danger);
      font-size: 14px;
    }

    /* PROFILE */

    #profileScreen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .profile-card {
      width: 100%;
      max-width: 450px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
    }

    .profile-card h2 {
      margin-bottom: 8px;
    }

    .profile-card > p {
      color: var(--muted);
      margin-bottom: 22px;
    }

    .profile-photo {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      border: 3px solid var(--primary);
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--primary);
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: var(--primary);
      color: white;
      padding: 14px;
      border-radius: 11px;
      font-weight: 700;
      margin-top: 5px;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    /* APP */

    #appScreen {
      height: 100vh;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 340px;
      height: 100%;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text);
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 11px 13px;
      border-radius: 10px;
      outline: none;
    }

    .new-chat {
      width: 42px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 22px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 13px 5px;
      font-weight: 700;
    }

    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    #chatList {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .chat-item:hover {
      background: var(--bg);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--primary);
      flex-shrink: 0;
    }

    .avatar-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .chat-preview {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .empty-list {
      text-align: center;
      color: var(--muted);
      padding: 35px 20px;
      line-height: 1.5;
    }

    .profile-bottom {
      border-top: 1px solid var(--border);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-bottom .user-info {
      flex: 1;
      min-width: 0;
    }

    .profile-bottom strong,
    .profile-bottom small {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .profile-bottom small {
      color: var(--muted);
    }

    /* CHAT */

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      min-height: 70px;
      padding: 12px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: none;
    }

    .chat-header-info {
      min-width: 0;
    }

    .chat-header-info strong,
    .chat-header-info small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-header-info small {
      color: var(--muted);
      margin-top: 3px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 20%, rgba(37,99,235,.04), transparent 30%),
        var(--bg);
    }

    .welcome {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 30px;
    }

    .message-row {
      display: flex;
      margin-bottom: 9px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: min(75%, 600px);
      position: relative;
    }

    .bubble {
      padding: 9px 12px;
      border-radius: 14px;
      background: var(--other-bubble);
      border: 1px solid var(--border);
      line-height: 1.45;
      word-break: break-word;
    }

    .mine .bubble {
      background: var(--bubble);
      color: var(--bubble-text);
      border: 0;
    }

    .message-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      padding: 0 5px;
    }

    .mine .message-time {
      text-align: right;
    }

    .message-actions {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      opacity: 0;
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .message-actions button {
      border: 0;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 7px;
      font-size: 12px;
    }

    .reaction {
      display: inline-block;
      margin-top: -2px;
      padding: 2px 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
    }

    .reply-box {
      padding: 8px 12px;
      border-left: 3px solid var(--primary);
      background: rgba(0,0,0,.06);
      border-radius: 8px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .mine .reply-box {
      background: rgba(255,255,255,.14);
    }

    .reply-name {
      font-weight: 700;
      margin-bottom: 3px;
    }

    .composer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 10px;
    }

    #replyPreview {
      max-width: 800px;
      margin: 0 auto 8px;
      background: var(--bg);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #replyPreviewText {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .composer-row {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    #sendBtn {
      width: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 19px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 22px;
      border: 1px solid var(--border);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .search-result {
      margin-top: 10px;
    }

    .user-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }

    .user-result:hover {
      background: var(--bg);
    }

    .user-result-info {
      flex: 1;
    }

    .user-result-info small {
      color: var(--muted);
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .chat-panel {
        display: none;
      }

      .mobile-chat-open .sidebar {
        display: none;
      }

      .mobile-chat-open .chat-panel {
        display: flex;
      }

      .back-btn {
        display: block;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-card">
      <div class="logo">C</div>
      <h1>Chatterly</h1>
      <p>Simple, fast and real-time messaging.</p>

      <button id="googleLoginBtn" class="google-btn">
        <span class="google-icon">G</span>
        Continue with Google
      </button>

      <div id="loginStatus" class="status"></div>
    </div>
  </section>


  <!-- PROFILE SETUP -->
  <section id="profileScreen" class="hidden">
    <div class="profile-card">
      <img id="setupPhoto" class="profile-photo" src="" alt="Profile">

      <h2>Complete your profile</h2>
      <p>Create your Chatterly identity.</p>

      <div class="field">
        <label>Your Name</label>
        <input id="nameInput" type="text" maxlength="40"
               placeholder="Enter your name">
      </div>

      <div class="field">
        <label>Username</label>
        <input id="usernameInput" type="text" maxlength="20"
               placeholder="example123">
      </div>

      <button id="saveProfileBtn" class="primary-btn">
        Create Profile
      </button>

      <div id="profileStatus" class="status"></div>
    </div>
  </section>


  <!-- MAIN APP -->
  <section id="appScreen" class="hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand">Chatterly</div>

          <button id="themeBtn" class="icon-btn" title="Theme">
            🌙
          </button>
        </div>

        <div class="search-box">
          <input id="globalSearch"
                 type="text"
                 placeholder="Search username...">

          <button id="newChatBtn" class="new-chat">
            +
          </button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="chats">
          Chats
        </button>

        <button class="tab" data-tab="updates">
          Updates
        </button>

        <button class="tab" data-tab="calls">
          Calls
        </button>
      </div>

      <div id="chatList"></div>

      <div class="profile-bottom">
        <img id="bottomPhoto"
             class="avatar"
             src=""
             alt="">

        <div class="user-info">
          <strong id="bottomName">User</strong>
          <small id="bottomUsername">@username</small>
        </div>

        <button id="logoutBtn" class="icon-btn" title="Logout">
          ↪
        </button>
      </div>

    </aside>


    <!-- CHAT -->
    <main class="chat-panel">

      <header class="chat-header">

        <button id="backBtn" class="icon-btn back-btn">
          ←
        </button>

        <img id="headerPhoto"
             class="avatar"
             src=""
             alt="">

        <div class="chat-header-info">
          <strong id="headerName">Select a chat</strong>
          <small id="headerUsername"></small>
        </div>

      </header>


      <div id="messages">

        <div class="welcome">
          <div>
            <h2>Welcome to Chatterly 👋</h2>
            <p>Select a chat or start a new conversation.</p>
          </div>
        </div>

      </div>


      <div class="composer">

        <div id="replyPreview" class="hidden">
          <div id="replyPreviewText"></div>

          <button id="cancelReply" class="icon-btn">
            ×
          </button>
        </div>

        <div class="composer-row">

          <input id="messageInput"
                 type="text"
                 maxlength="2000"
                 placeholder="Type a message..."
                 autocomplete="off">

          <button id="sendBtn">
            ➤
          </button>

        </div>

      </div>

    </main>

  </section>


  <!-- NEW CHAT MODAL -->
  <div id="newChatModal" class="modal-overlay hidden">

    <div class="modal">

      <div class="modal-head">
        <h2>New Chat</h2>

        <button id="closeModal" class="icon-btn">
          ×
        </button>
      </div>

      <div class="field">
        <label>Search username</label>

        <input id="userSearchInput"
               type="text"
               maxlength="20"
               placeholder="@username">
      </div>

      <button id="searchUserBtn" class="primary-btn">
        Search
      </button>

      <div id="searchResult" class="search-result"></div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    /*
      ============================================================
      CHATERLY FIREBASE CONFIG
      ============================================================

      Replace these values with your NEW Chatterly Firebase
      Web App config.

      Firebase Console:
      Project Settings
      -> General
      -> Your apps
      -> Web app
      -> SDK setup and configuration
    */

    const firebaseConfig = {
      
apiKey: "AIzaSyDitPl7OUTOxzRtiaFBjTKFdB1T_YqLFM4",
  authDomain: "catterfly-64309.firebaseapp.com",
  projectId: "catterfly-64309",
  storageBucket: "catterfly-64309.firebasestorage.app",
  messagingSenderId: "875167607108",
  appId: "1:875167607108:web:49cab44656f7467bb64f11",
  measurementId: "G-JML2V6YEDS"

    };


    /* FIREBASE IMPORTS */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      collection,
      query,
      where,
      orderBy,
      onSnapshot,
      serverTimestamp,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /* INITIALIZE */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });


    /* STATE */

    let currentUser = null;

    let currentProfile = null;

    let currentChatId = null;

    let currentOtherUser = null;

    let messagesUnsubscribe = null;

    let chatsUnsubscribe = null;

    let replyingTo = null;


    /* ELEMENTS */

    const loginScreen =
      document.getElementById("loginScreen");

    const profileScreen =
      document.getElementById("profileScreen");

    const appScreen =
      document.getElementById("appScreen");

    const googleLoginBtn =
      document.getElementById("googleLoginBtn");

    const loginStatus =
      document.getElementById("loginStatus");

    const profileStatus =
      document.getElementById("profileStatus");

    const setupPhoto =
      document.getElementById("setupPhoto");

    const nameInput =
      document.getElementById("nameInput");

    const usernameInput =
      document.getElementById("usernameInput");

    const saveProfileBtn =
      document.getElementById("saveProfileBtn");

    const bottomPhoto =
      document.getElementById("bottomPhoto");

    const bottomName =
      document.getElementById("bottomName");

    const bottomUsername =
      document.getElementById("bottomUsername");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const themeBtn =
      document.getElementById("themeBtn");

    const chatList =
      document.getElementById("chatList");

    const headerPhoto =
      document.getElementById("headerPhoto");

    const headerName =
      document.getElementById("headerName");

    const headerUsername =
      document.getElementById("headerUsername");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const replyPreview =
      document.getElementById("replyPreview");

    const replyPreviewText =
      document.getElementById("replyPreviewText");

    const cancelReply =
      document.getElementById("cancelReply");

    const newChatBtn =
      document.getElementById("newChatBtn");

    const newChatModal =
      document.getElementById("newChatModal");

    const closeModal =
      document.getElementById("closeModal");

    const userSearchInput =
      document.getElementById("userSearchInput");

    const searchUserBtn =
      document.getElementById("searchUserBtn");

    const searchResult =
      document.getElementById("searchResult");

    const backBtn =
      document.getElementById("backBtn");


    /* ============================================================
       HELPERS
       ============================================================ */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function makeUsername(value) {

      return value
        .toLowerCase()
        .trim()
        .replace(/^@/, "")
        .replace(/[^a-z0-9_]/g, "");
    }


    function getChatId(uid1, uid2) {

      return [uid1, uid2]
        .sort()
        .join("_");
    }


    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      try {

        const date = timestamp.toDate();

        return date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      } catch {
        return "";
      }
    }


    function getInitial(name) {

      return (name || "U")
        .charAt(0)
        .toUpperCase();
    }


    function avatarHtml(photoURL, name, className = "avatar") {

      if (photoURL) {

        return `
          <img
            class="${className}"
            src="${escapeHtml(photoURL)}"
            alt=""
          >
        `;

      }

      return `
        <div class="${className} avatar-letter">
          ${escapeHtml(getInitial(name))}
        </div>
      `;
    }


    function showScreen(screen) {

      loginScreen.classList.add("hidden");

      profileScreen.classList.add("hidden");

      appScreen.classList.add("hidden");

      screen.classList.remove("hidden");
    }


    function showError(element, message) {

      element.textContent = message;
    }


    /* ============================================================
       GOOGLE LOGIN
       ============================================================ */

    googleLoginBtn.addEventListener("click", async () => {

      loginStatus.textContent = "Opening Google login...";

      try {

        await signInWithRedirect(auth, provider);

      } catch (error) {

        console.error(error);

        loginStatus.textContent =
          "Login failed: " + error.message;
      }

    });


    /*
      This handles the result after Google redirects back
      to GitHub Pages.
    */

    try {

      await getRedirectResult(auth);

    } catch (error) {

      console.error("Redirect login error:", error);

      loginStatus.textContent =
        "Google login error: " + error.message;
    }


    /* ============================================================
       AUTH STATE
       ============================================================ */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        currentUser = null;

        currentProfile = null;

        showScreen(loginScreen);

        return;
      }


      currentUser = user;


      /*
        Check whether profile already exists.
      */

      try {

        const userRef =
          doc(db, "users", user.uid);

        const userSnap =
          await getDoc(userRef);


        if (userSnap.exists()) {

          currentProfile = {
            uid: user.uid,
            ...userSnap.data()
          };

          openApp();

        } else {

          setupProfileScreen();

        }

      } catch (error) {

        console.error(error);

        showError(
          loginStatus,
          "Could not load your profile: " +
          error.message
        );

        showScreen(loginScreen);
      }

    });


    /* ============================================================
       PROFILE SETUP
       ============================================================ */

    function setupProfileScreen() {

      showScreen(profileScreen);

      setupPhoto.src =
        currentUser.photoURL ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(
          currentUser.displayName || "User"
        );

      nameInput.value =
        currentUser.displayName || "";

      usernameInput.value = "";

      profileStatus.textContent = "";
    }


    saveProfileBtn.addEventListener("click", async () => {

      const name =
        nameInput.value.trim();

      const username =
        makeUsername(usernameInput.value);


      if (name.length < 2) {

        profileStatus.textContent =
          "Enter a valid name.";

        return;
      }


      if (username.length < 3) {

        profileStatus.textContent =
          "Username must contain at least 3 letters/numbers.";

        return;
      }


      if (username.length > 20) {

        profileStatus.textContent =
          "Username is too long.";

        return;
      }


      saveProfileBtn.disabled = true;

      profileStatus.textContent =
        "Creating profile...";


      try {

        /*
          Check username availability.
        */

        const usernameRef =
          doc(db, "usernames", username);

        const usernameSnap =
          await getDoc(usernameRef);


        if (usernameSnap.exists()) {

          profileStatus.textContent =
            "This username is already taken.";

          saveProfileBtn.disabled = false;

          return;
        }


        /*
          Create username record.
        */

        await setDoc(usernameRef, {

          uid: currentUser.uid,

          username: username,

          createdAt: serverTimestamp()

        });


        /*
          Create user profile.
          No Storage used.
        */

        await setDoc(
          doc(db, "users", currentUser.uid),
          {

            uid: currentUser.uid,

            name: name,

            username: username,

            photoURL: currentUser.photoURL || "",

            createdAt: serverTimestamp(),

            updatedAt: serverTimestamp()

          }
        );


        currentProfile = {

          uid: currentUser.uid,

          name: name,

          username: username,

          photoURL: currentUser.photoURL || ""

        };


        openApp();


      } catch (error) {

        console.error(error);

        profileStatus.textContent =
          "Profile error: " + error.message;

      } finally {

        saveProfileBtn.disabled = false;
      }

    });


    /* ============================================================
       OPEN APP
       ============================================================ */

    function openApp() {

      showScreen(appScreen);

      updateBottomProfile();

      startChatListListener();
    }


    function updateBottomProfile() {

      bottomName.textContent =
        currentProfile?.name || "User";

      bottomUsername.textContent =
        "@" + (currentProfile?.username || "");

      if (currentProfile?.photoURL) {

        bottomPhoto.src =
          currentProfile.photoURL;

        bottomPhoto.style.display =
          "block";

      } else {

        bottomPhoto.src =
          "https://ui-avatars.com/api/?name=" +
          encodeURIComponent(
            currentProfile?.name || "User"
          );
      }

    }


    /* ============================================================
       CHAT LIST
       ============================================================ */

    function startChatListListener() {

      if (chatsUnsubscribe) {

        chatsUnsubscribe();

      }


      const chatsRef =
        collection(db, "chats");


      const q =
        query(
          chatsRef,
          where(
            "members",
            "array-contains",
            currentUser.uid
          )
        );


      chatsUnsubscribe =
        onSnapshot(
          q,
          async (snapshot) => {

            const chatData = [];


            for (const chatDoc of snapshot.docs) {

              const data = chatDoc.data();

              const otherUid =
                data.members.find(
                  uid => uid !== currentUser.uid
                );


              if (!otherUid) {
                continue;
              }


              try {

                const otherSnap =
                  await getDoc(
                    doc(db, "users", otherUid)
                  );


                if (!otherSnap.exists()) {
                  continue;
                }


                chatData.push({

                  id: chatDoc.id,

                  ...data,

                  other: {

                    uid: otherUid,

                    ...otherSnap.data()

                  }

                });

              } catch (error) {

                console.error(error);

              }

            }


            /*
              Sort locally.
              This avoids requiring a Firestore composite index.
            */

            chatData.sort((a, b) => {

              const aTime =
                a.updatedAt?.toMillis?.() || 0;

              const bTime =
                b.updatedAt?.toMillis?.() || 0;

              return bTime - aTime;

            });


            renderChatList(chatData);

          },

          error => {

            console.error(
              "Chat list error:",
              error
            );

            chatList.innerHTML = `
              <div class="empty-list">
                Unable to load chats.<br>
                Check your Firestore rules.
              </div>
            `;
          }
        );

    }


    function renderChatList(chats) {

      if (!chats.length) {

        chatList.innerHTML = `
          <div class="empty-list">
            No chats yet.<br><br>
            Press <b>+</b> to start a conversation.
          </div>
        `;

        return;
      }


      chatList.innerHTML = "";


      chats.forEach(chat => {

        const item =
          document.createElement("div");

        item.className = "chat-item";


        const photo =
          chat.other.photoURL ||
          "https://ui-avatars.com/api/?name=" +
          encodeURIComponent(
            chat.other.name || "User"
          );


        item.innerHTML = `

          <img
            class="avatar"
            src="${escapeHtml(photo)}"
            alt=""
          >

          <div class="chat-info">

            <div class="chat-name">
              ${escapeHtml(chat.other.name || "User")}
            </div>

            <div class="chat-preview">
              ${escapeHtml(
                chat.lastMessage || "Start chatting"
              )}
            </div>

          </div>
        `;


        item.addEventListener(
          "click",
          () => {

            openChat(
              chat.id,
              chat.other
            );

          }
        );


        chatList.appendChild(item);

      });

    }


    /* ============================================================
       OPEN CHAT
       ============================================================ */

    async function openChat(chatId, otherUser) {

      currentChatId = chatId;

      currentOtherUser = otherUser;


      headerName.textContent =
        otherUser.name || "User";

      headerUsername.textContent =
        "@" + (otherUser.username || "");


      if (otherUser.photoURL) {

        headerPhoto.src =
          otherUser.photoURL;

      } else {

        headerPhoto.src =
          "https://ui-avatars.com/api/?name=" +
          encodeURIComponent(
            otherUser.name || "User"
          );

      }


      document.body.classList.add(
        "mobile-chat-open"
      );


      if (messagesUnsubscribe) {

        messagesUnsubscribe();

      }


      messages.innerHTML = `
        <div class="welcome">
          Loading messages...
        </div>
      `;


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const q =
        query(
          messagesRef,
          orderBy("createdAt", "asc")
        );


      messagesUnsubscribe =
        onSnapshot(
          q,
          snapshot => {

            renderMessages(
              snapshot.docs
            );

          },

          error => {

            console.error(
              "Messages error:",
              error
            );

            messages.innerHTML = `
              <div class="welcome">
                Unable to load messages.
              </div>
            `;

          }
        );

    }


    /* ============================================================
       RENDER MESSAGES
       ============================================================ */

    function renderMessages(docs) {

      if (!docs.length) {

        messages.innerHTML = `
          <div class="welcome">
            <div>
              <h3>Say Hello 👋</h3>
              <p>No messages yet.</p>
            </div>
          </div>
        `;

        return;
      }


      messages.innerHTML = "";


      docs.forEach(messageDoc => {

        const data =
          messageDoc.data();

        const mine =
          data.senderId === currentUser.uid;


        const row =
          document.createElement("div");

        row.className =
          "message-row " +
          (mine ? "mine" : "");


        const wrapper =
          document.createElement("div");

        wrapper.className = "message";


        let replyHtml = "";


        if (data.replyTo) {

          replyHtml = `

            <div class="reply-box">

              <div class="reply-name">
                ${escapeHtml(
                  data.replyTo.name || "User"
                )}
              </div>

              <div>
                ${escapeHtml(
                  data.replyTo.text || ""
                )}
              </div>

            </div>
          `;
        }


        const reactionHtml =
          data.reaction
            ? `
              <span class="reaction">
                ${escapeHtml(data.reaction)}
              </span>
            `
            : "";


        wrapper.innerHTML = `

          <div class="bubble">

            ${replyHtml}

            <div>
              ${escapeHtml(data.text || "")}
            </div>

            ${reactionHtml}

          </div>

          <div class="message-time">
            ${formatTime(data.createdAt)}
          </div>

          <div class="message-actions">

            <button
              class="reply-message"
              data-id="${messageDoc.id}">
              ↩ Reply
            </button>

            <button
              class="react-message"
              data-id="${messageDoc.id}">
              ❤️
            </button>

            ${
              mine
              ? `
                <button
                  class="delete-message"
                  data-id="${messageDoc.id}">
                  Delete
                </button>
              `
              : ""
            }

          </div>
        `;


        row.appendChild(wrapper);

        messages.appendChild(row);


        const replyButton =
          wrapper.querySelector(
            ".reply-message"
          );


        replyButton.addEventListener(
          "click",
          () => {

            startReply({

              id: messageDoc.id,

              text: data.text || "",

              name: mine
                ? currentProfile.name
                : currentOtherUser.name

            });

          }
        );


        const reactButton =
          wrapper.querySelector(
            ".react-message"
          );


        reactButton.addEventListener(
          "click",
          () => {

            toggleReaction(
              messageDoc.id,
              data.reaction
            );

          }
        );


        const deleteButton =
          wrapper.querySelector(
            ".delete-message"
          );


        if (deleteButton) {

          deleteButton.addEventListener(
            "click",
            () => {

              deleteMessage(
                messageDoc.id
              );

            }
          );

        }

      });


      messages.scrollTop =
        messages.scrollHeight;

    }


    /* ============================================================
       SEND MESSAGE
       ============================================================ */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      if (!currentChatId || !currentOtherUser) {

        alert(
          "First select a chat."
        );

        return;
      }


      sendBtn.disabled = true;


      try {

        /*
          Make sure chat document exists.
        */

        const chatRef =
          doc(
            db,
            "chats",
            currentChatId
          );


        const chatSnap =
          await getDoc(chatRef);


        if (!chatSnap.exists()) {

          await setDoc(
            chatRef,
            {

              members: [
                currentUser.uid,
                currentOtherUser.uid
              ],

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp(),

              lastMessage: ""

            }
          );

        }


        const messageData = {

          senderId:
            currentUser.uid,

          text: text,

          createdAt:
            serverTimestamp()

        };


        if (replyingTo) {

          messageData.replyTo = {

            id: replyingTo.id,

            text: replyingTo.text,

            name: replyingTo.name

          };

        }


        await addDoc(
          collection(
            db,
            "chats",
            currentChatId,
            "messages"
          ),
          messageData
        );


        await updateDoc(
          chatRef,
          {

            lastMessage: text,

            updatedAt:
              serverTimestamp()

          }
        );


        messageInput.value = "";

        cancelReplyMode();


      } catch (error) {

        console.error(error);

        alert(
          "Message failed: " +
          error.message
        );

      } finally {

        sendBtn.disabled = false;

        messageInput.focus();

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ============================================================
       REPLY
       ============================================================ */

    function startReply(message) {

      replyingTo = message;


      replyPreview.classList.remove(
        "hidden"
      );


      replyPreviewText.textContent =
        "Replying to " +
        message.name +
        ": " +
        message.text;


      messageInput.focus();

    }


    function cancelReplyMode() {

      replyingTo = null;

      replyPreview.classList.add(
        "hidden"
      );

      replyPreviewText.textContent = "";

    }


    cancelReply.addEventListener(
      "click",
      cancelReplyMode
    );


    /* ============================================================
       REACTION
       ============================================================ */

    async function toggleReaction(
      messageId,
      currentReaction
    ) {

      if (!currentChatId) {
        return;
      }


      try {

        const messageRef =
          doc(
            db,
            "chats",
            currentChatId,
            "messages",
            messageId
          );


        await updateDoc(
          messageRef,
          {

            reaction:
              currentReaction
                ? null
                : "❤️"

          }
        );


      } catch (error) {

        console.error(error);

      }

    }


    /* ============================================================
       DELETE
       ============================================================ */

    async function deleteMessage(
      messageId
    ) {

      if (!currentChatId) {
        return;
      }


      const okay =
        confirm(
          "Delete this message?"
        );


      if (!okay) {
        return;
      }


      try {

        await deleteDoc(
          doc(
            db,
            "chats",
            currentChatId,
            "messages",
            messageId
          )
        );

      } catch (error) {

        console.error(error);

        alert(
          "Could not delete message: " +
          error.message
        );

      }

    }


    /* ============================================================
       NEW CHAT
       ============================================================ */

    newChatBtn.addEventListener(
      "click",
      () => {

        newChatModal.classList.remove(
          "hidden"
        );

        userSearchInput.value = "";

        searchResult.innerHTML = "";

        userSearchInput.focus();

      }
    );


    closeModal.addEventListener(
      "click",
      () => {

        newChatModal.classList.add(
          "hidden"
        );

      }
    );


    newChatModal.addEventListener(
      "click",
      event => {

        if (
          event.target === newChatModal
        ) {

          newChatModal.classList.add(
            "hidden"
          );

        }

      }
    );


    searchUserBtn.addEventListener(
      "click",
      searchUser
    );


    userSearchInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          searchUser();

        }

      }
    );


    async function searchUser() {

      const username =
        makeUsername(
          userSearchInput.value
        );


      searchResult.innerHTML =
        "Searching...";


      if (username.length < 3) {

        searchResult.innerHTML =
          "Enter at least 3 characters.";

        return;
      }


      try {

        const usernameRef =
          doc(
            db,
            "usernames",
            username
          );


        const usernameSnap =
          await getDoc(usernameRef);


        if (!usernameSnap.exists()) {

          searchResult.innerHTML =
            "User not found.";

          return;
        }


        const uid =
          usernameSnap.data().uid;


        if (uid === currentUser.uid) {

          searchResult.innerHTML =
            "This is your own username.";

          return;
        }


        const userSnap =
          await getDoc(
            doc(
              db,
              "users",
              uid
            )
          );


        if (!userSnap.exists()) {

          searchResult.innerHTML =
            "User profile not found.";

          return;
        }


        const user =
          userSnap.data();


        const photo =
          user.photoURL ||
          "https://ui-avatars.com/api/?name=" +
          encodeURIComponent(
            user.name || "User"
          );


        searchResult.innerHTML = `

          <div class="user-result">

            <img
              class="avatar"
              src="${escapeHtml(photo)}"
              alt=""
            >

            <div class="user-result-info">

              <strong>
                ${escapeHtml(user.name)}
              </strong>

              <small>
                @${escapeHtml(user.username)}
              </small>

            </div>

          </div>
        `;


        const result =
          searchResult.querySelector(
            ".user-result"
          );


        result.addEventListener(
          "click",
          () => {

            startNewChat(user);

          }
        );


      } catch (error) {

        console.error(error);

        searchResult.innerHTML =
          "Search error: " +
          escapeHtml(error.message);

      }

    }


    /* ============================================================
       START NEW CHAT
       ============================================================ */

    async function startNewChat(user) {

      const chatId =
        getChatId(
          currentUser.uid,
          user.uid
        );


      try {

        const chatRef =
          doc(
            db,
            "chats",
            chatId
          );


        const chatSnap =
          await getDoc(chatRef);


        if (!chatSnap.exists()) {

          await setDoc(
            chatRef,
            {

              members: [
                currentUser.uid,
                user.uid
              ],

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp(),

              lastMessage: ""

            }
          );

        }


        newChatModal.classList.add(
          "hidden"
        );


        openChat(
          chatId,
          user
        );


      } catch (error) {

        console.error(error);

        alert(
          "Could not start chat: " +
          error.message
        );

      }

    }


    /* ============================================================
       LOGOUT
       ============================================================ */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          if (messagesUnsubscribe) {
            messagesUnsubscribe();
          }

          if (chatsUnsubscribe) {
            chatsUnsubscribe();
          }

          await signOut(auth);

          document.body.classList.remove(
            "mobile-chat-open"
          );

        } catch (error) {

          console.error(error);

        }

      }
    );


    /* ============================================================
       DARK MODE
       ============================================================ */

    const savedTheme =
      localStorage.getItem(
        "chatterly-theme"
      );


    if (savedTheme === "dark") {

      document.body.classList.add(
        "dark"
      );

      themeBtn.textContent = "☀️";

    }


    themeBtn.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "dark"
        );


        const dark =
          document.body.classList.contains(
            "dark"
          );


        localStorage.setItem(
          "chatterly-theme",
          dark ? "dark" : "light"
        );


        themeBtn.textContent =
          dark ? "☀️" : "🌙";

      }
    );


    /* ============================================================
       MOBILE BACK
       ============================================================ */

    backBtn.addEventListener(
      "click",
      () => {

        document.body.classList.remove(
          "mobile-chat-open"
        );

        currentChatId = null;

        currentOtherUser = null;

        if (messagesUnsubscribe) {

          messagesUnsubscribe();

          messagesUnsubscribe = null;

        }

      }
    );


    /* ============================================================
       TABS
       ============================================================ */

    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".tab")
              .forEach(t =>
                t.classList.remove(
                  "active"
                )
              );


            tab.classList.add("active");


            const type =
              tab.dataset.tab;


            if (type === "updates") {

              chatList.innerHTML = `
                <div class="empty-list">
                  Updates will be added here.
                </div>
              `;

            }


            if (type === "calls") {

              chatList.innerHTML = `
                <div class="empty-list">
                  Calls will be added here.
                </div>
              `;

            }


            if (type === "chats") {

              startChatListListener();

            }

          }
        );

      });


    /* ============================================================
       GLOBAL USERNAME SEARCH
       ============================================================ */

    const globalSearch =
      document.getElementById(
        "globalSearch"
      );


    globalSearch.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          const value =
            globalSearch.value.trim();


          if (value) {

            newChatModal.classList.remove(
              "hidden"
            );

            userSearchInput.value =
              value.replace(/^@/, "");

            searchUser();

          }

        }

      }
    );

  </script>

</body>
  </html>
