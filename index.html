<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatterly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --border:#e5e7eb;
  --mine:#dbeafe;
  --other:#ffffff;
}

body.dark{
  --bg:#0f172a;
  --card:#111827;
  --text:#f9fafb;
  --muted:#9ca3af;
  --primary:#3b82f6;
  --primary2:#2563eb;
  --border:#243044;
  --mine:#1e3a5f;
  --other:#172033;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
  width:70px;
  height:70px;
  border-radius:20px;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin:0 auto 18px;
}

.login-card h1{
  font-size:30px;
  margin-bottom:8px;
}

.login-card p{
  color:var(--muted);
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:white;
  color:#222;
  border:1px solid #ddd;
  font-weight:bold;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.google-btn:hover{
  background:#f7f7f7;
}

/* PROFILE */

#profilePage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.profile-card{
  width:100%;
  max-width:430px;
  background:var(--card);
  padding:28px;
  border-radius:22px;
  border:1px solid var(--border);
}

.profile-card h2{
  margin-bottom:8px;
}

.profile-card p{
  color:var(--muted);
  margin-bottom:20px;
}

.profile-photo{
  width:85px;
  height:85px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 20px;
}

.input{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
  margin-bottom:12px;
}

.primary-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:var(--primary);
  color:white;
  font-weight:bold;
  margin-top:5px;
}

.primary-btn:hover{
  background:var(--primary2);
}

.skip-btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid var(--border);
  border-radius:11px;
  background:transparent;
  color:var(--text);
}

.error{
  color:#ef4444;
  font-size:13px;
  margin:8px 0;
}

/* APP */

#appPage{
  height:100vh;
  display:flex;
}

.sidebar{
  width:340px;
  border-right:1px solid var(--border);
  background:var(--card);
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:23px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
}

.search-box{
  padding:12px;
  border-bottom:1px solid var(--border);
}

.search-input{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:10px;
  outline:none;
}

.search-results{
  max-height:220px;
  overflow-y:auto;
}

.user-result{
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.user-result:hover{
  background:var(--bg);
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-username{
  color:var(--muted);
  font-size:13px;
}

.chat-list{
  flex:1;
  overflow-y:auto;
}

.chat-item{
  padding:13px 15px;
  display:flex;
  gap:11px;
  align-items:center;
  cursor:pointer;
  border-bottom:1px solid var(--border);
}

.chat-item:hover{
  background:var(--bg);
}

.chat-preview{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CHAT */

.chat-area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:70px;
  padding:12px 17px;
  border-bottom:1px solid var(--border);
  background:var(--card);
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  display:none;
}

.chat-user-info{
  flex:1;
}

.chat-user-name{
  font-weight:bold;
}

.chat-user-status{
  color:#22c55e;
  font-size:12px;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:var(--bg);
}

.empty-chat{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:var(--muted);
}

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:75%;
  padding:10px 12px;
  border-radius:14px;
  background:var(--other);
  border:1px solid var(--border);
  position:relative;
}

.message-row.mine .message{
  background:var(--mine);
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
}

.message-time{
  font-size:10px;
  color:var(--muted);
  text-align:right;
  margin-top:4px;
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:5px;
}

.message-actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:2px 4px;
}

.reply-box{
  border-left:3px solid var(--primary);
  padding-left:8px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
}

.reaction{
  font-size:12px;
  margin-top:3px;
}

.composer{
  padding:12px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
}

.message-input{
  flex:1;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:12px;
  border-radius:12px;
  outline:none;
}

.send-btn{
  width:50px;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-size:20px;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    width:100%;
  }

  .chat-area{
    display:none;
  }

  #appPage.chat-open .sidebar{
    display:none;
  }

  #appPage.chat-open .chat-area{
    display:flex;
  }

  .back-btn{
    display:block;
  }

  .message{
    max-width:85%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
  <div class="login-card">
    <div class="logo">C</div>
    <h1>Chatterly</h1>
    <p>Simple, private and real-time chatting.</p>

    <button class="google-btn" id="googleLogin">
      <span>G</span>
      Continue with Google
    </button>

    <div id="loginError" class="error"></div>
  </div>
</section>


<!-- PROFILE -->
<section id="profilePage" class="hidden">
  <div class="profile-card">

    <img id="profilePhoto" class="profile-photo">

    <h2>Set up your profile</h2>
    <p>You can complete it now or skip and start using Chatterly.</p>

    <input
      id="displayName"
      class="input"
      placeholder="Your name"
      maxlength="40"
    >

    <input
      id="username"
      class="input"
      placeholder="Username e.g. aashish123"
      maxlength="20"
    >

    <div id="profileError" class="error"></div>

    <button id="saveProfile" class="primary-btn">
      Continue
    </button>

    <button id="skipProfile" class="skip-btn">
      Skip for now
    </button>

  </div>
</section>


<!-- APP -->
<section id="appPage" class="hidden">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="brand">Chatterly</div>

      <div class="header-actions">
        <button class="icon-btn" id="darkModeBtn">🌙</button>
        <button class="icon-btn" id="logoutBtn">↪</button>
      </div>
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        placeholder="Search username..."
      >

      <div id="searchResults" class="search-results"></div>

    </div>

    <div id="chatList" class="chat-list"></div>

  </aside>


  <main class="chat-area">

    <div class="chat-header">

      <button id="backBtn" class="icon-btn back-btn">←</button>

      <img id="chatAvatar" class="avatar">

      <div class="chat-user-info">
        <div id="chatName" class="chat-user-name">
          Select a chat
        </div>

        <div id="chatStatus" class="chat-user-status">
        </div>
      </div>

    </div>


    <div id="messages" class="messages">

      <div class="empty-chat">
        <div>
          <h2>Welcome to Chatterly 👋</h2>
          <p>Search for a username to start chatting.</p>
        </div>
      </div>

    </div>


    <div class="composer">

      <input
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendBtn" class="send-btn">
        ➤
      </button>

    </div>

  </main>

</section>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   YOUR FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDitPl7OUTOxzRtiaFBjTKFdB1T_YqLFM4",
  authDomain: "catterfly-64309.firebaseapp.com",
  projectId: "catterfly-64309",
  storageBucket: "catterfly-64309.firebasestorage.app",
  messagingSenderId: "875167607108",
  appId: "1:875167607108:web:49cab44656f7467bb64f11",
  measurementId: "G-JML2V6YEDS"
};


/* =========================
   FIREBASE INIT
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentChatUser = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;

const $ = id => document.getElementById(id);


/* =========================
   PAGE HELPERS
========================= */

function showPage(page){

  $("loginPage").classList.add("hidden");
  $("profilePage").classList.add("hidden");
  $("appPage").classList.add("hidden");

  $(page).classList.remove("hidden");
}


/* =========================
   AVATAR
========================= */

function avatarURL(user){

  if(user?.photoURL){
    return user.photoURL;
  }

  const name =
    user?.displayName ||
    user?.username ||
    "User";

  return "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name) +
    "&background=2563eb&color=fff";
}


/* =========================
   GOOGLE LOGIN
========================= */

$("googleLogin").addEventListener("click", async () => {

  $("loginError").textContent = "";

  try{

    await signInWithRedirect(auth, provider);

  }catch(error){

    console.error(error);

    $("loginError").textContent =
      error.message || "Google login failed.";

  }

});


/* =========================
   REDIRECT RESULT
========================= */

getRedirectResult(auth)
  .then(result => {

    if(result?.user){
      console.log("Google login successful");
    }

  })
  .catch(error => {

    console.error(error);

    $("loginError").textContent =
      error.message || "Login failed.";

  });


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async user => {

  if(!user){

    currentUser = null;
    currentProfile = null;

    showPage("loginPage");

    return;
  }

  currentUser = user;

  await handleUserLogin();

});


/* =========================
   USER LOGIN
========================= */

async function handleUserLogin(){

  try{

    const userRef =
      doc(db, "users", currentUser.uid);

    const userSnap =
      await getDoc(userRef);


    if(userSnap.exists()){

      currentProfile = userSnap.data();

      showPage("appPage");

      loadChats();

    }else{

      $("profilePhoto").src =
        avatarURL(currentUser);

      $("displayName").value =
        currentUser.displayName || "";

      showPage("profilePage");

    }

  }catch(error){

    console.error(error);

    $("loginError").textContent =
      error.message;

    showPage("loginPage");

  }

}


/* =========================
   CREATE PROFILE
========================= */

$("saveProfile").addEventListener("click", async () => {

  const name =
    $("displayName").value.trim();

  let username =
    $("username").value.trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");

  $("profileError").textContent = "";

  if(!name){

    $("profileError").textContent =
      "Please enter your name.";

    return;
  }

  if(!username){

    $("profileError").textContent =
      "Please enter a username.";

    return;
  }

  if(username.length < 3){

    $("profileError").textContent =
      "Username must be at least 3 characters.";

    return;
  }

  try{

    const usernameRef =
      doc(db, "usernames", username);

    const usernameSnap =
      await getDoc(usernameRef);

    if(usernameSnap.exists()){

      $("profileError").textContent =
        "This username is already taken.";

      return;
    }


    const profile = {

      uid: currentUser.uid,

      name: name,

      username: username,

      photoURL: currentUser.photoURL || "",

      createdAt: serverTimestamp()

    };


    await setDoc(
      doc(db, "users", currentUser.uid),
      profile
    );


    await setDoc(
      usernameRef,
      {
        uid: currentUser.uid,
        username: username
      }
    );


    currentProfile = profile;

    showPage("appPage");

    loadChats();

  }catch(error){

    console.error(error);

    $("profileError").textContent =
      error.message || "Profile setup failed.";

  }

});


/* =========================
   SKIP PROFILE
========================= */

$("skipProfile").addEventListener("click", async () => {

  $("profileError").textContent = "";

  try{

    const generatedUsername =
      "user_" +
      currentUser.uid
        .substring(0,8)
        .toLowerCase();

    const profile = {

      uid: currentUser.uid,

      name:
        currentUser.displayName ||
        "Chatterly User",

      username: generatedUsername,

      photoURL:
        currentUser.photoURL || "",

      skippedProfile: true,

      createdAt: serverTimestamp()

    };


    await setDoc(
      doc(db, "users", currentUser.uid),
      profile
    );


    await setDoc(
      doc(db, "usernames", generatedUsername),
      {
        uid: currentUser.uid,
        username: generatedUsername
      }
    );


    currentProfile = profile;

    showPage("appPage");

    loadChats();

  }catch(error){

    console.error(error);

    $("profileError").textContent =
      error.message || "Could not skip profile.";

  }

});


/* =========================
   CHAT ID
========================= */

function makeChatId(uid1, uid2){

  return [uid1, uid2]
    .sort()
    .join("_");

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(user){

  currentChatUser = user;

  currentChatId =
    makeChatId(
      currentUser.uid,
      user.uid
    );


  try{

    await setDoc(
      doc(db, "chats", currentChatId),
      {
        members: [
          currentUser.uid,
          user.uid
        ],

        userNames: {
          [currentUser.uid]:
            currentProfile?.name || "User",

          [user.uid]:
            user.name || "User"
        },

        userUsernames: {
          [currentUser.uid]:
            currentProfile?.username || "",

          [user.uid]:
            user.username || ""
        },

        updatedAt: serverTimestamp()
      },
      {
        merge:true
      }
    );


    $("chatName").textContent =
      user.name || "User";

    $("chatStatus").textContent =
      "Online";

    $("chatAvatar").src =
      avatarURL(user);


    $("messages").innerHTML = "";

    listenMessages();

    document
      .getElementById("appPage")
      .classList.add("chat-open");

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Could not open chat."
    );

  }

}


/* =========================
   LISTEN MESSAGES
========================= */

function listenMessages(){

  if(unsubscribeMessages){
    unsubscribeMessages();
  }

  const messagesRef =
    collection(
      db,
      "chats",
      currentChatId,
      "messages"
    );


  const q =
    query(
      messagesRef,
      orderBy("createdAt","asc")
    );


  unsubscribeMessages =
    onSnapshot(q, snapshot => {

      $("messages").innerHTML = "";

      if(snapshot.empty){

        $("messages").innerHTML = `
          <div class="empty-chat">
            <div>
              <h3>No messages yet</h3>
              <p>Send the first message 👋</p>
            </div>
          </div>
        `;

        return;
      }


      snapshot.forEach(messageDoc => {

        renderMessage(
          messageDoc.id,
          messageDoc.data()
        );

      });


      $("messages").scrollTop =
        $("messages").scrollHeight;

    }, error => {

      console.error(error);

    });

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(id, data){

  const mine =
    data.senderId === currentUser.uid;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (mine ? "mine" : "");


  const box =
    document.createElement("div");

  box.className = "message";


  if(data.replyText){

    const reply =
      document.createElement("div");

    reply.className = "reply-box";

    reply.textContent =
      data.replyText;

    box.appendChild(reply);

  }


  const text =
    document.createElement("div");

  text.className = "message-text";

  text.textContent =
    data.text || "";

  box.appendChild(text);


  if(data.reaction){

    const reaction =
      document.createElement("div");

    reaction.className =
      "reaction";

    reaction.textContent =
      "❤️ " + data.reaction;

    box.appendChild(reaction);

  }


  const time =
    document.createElement("div");

  time.className =
    "message-time";

  if(data.createdAt){

    try{

      time.textContent =
        new Date(
          data.createdAt.seconds * 1000
        ).toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }catch{

      time.textContent = "";

    }

  }


  box.appendChild(time);


  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";


  const reactBtn =
    document.createElement("button");

  reactBtn.textContent =
    "❤️";

  reactBtn.onclick = () =>
    toggleReaction(id, data);


  const replyBtn =
    document.createElement("button");

  replyBtn.textContent =
    "Reply";

  replyBtn.onclick = () =>
    replyMessage(data);


  actions.appendChild(reactBtn);

  actions.appendChild(replyBtn);


  if(mine){

    const deleteBtn =
      document.createElement("button");

    deleteBtn.textContent =
      "Delete";

    deleteBtn.onclick = () =>
      deleteMessage(id);

    actions.appendChild(deleteBtn);

  }


  box.appendChild(actions);

  row.appendChild(box);

  $("messages").appendChild(row);

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text) return;

  if(!currentChatId) return;


  input.value = "";


  try{

    await addDoc(
      collection(
        db,
        "chats",
        currentChatId,
        "messages"
      ),
      {
        text: text,

        senderId:
          currentUser.uid,

        senderName:
          currentProfile?.name ||
          "User",

        createdAt:
          serverTimestamp()
      }
    );


    await updateDoc(
      doc(
        db,
        "chats",
        currentChatId
      ),
      {
        lastMessage: text,
        updatedAt: serverTimestamp()
      }
    );


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Message could not be sent."
    );

  }

}


$("sendBtn").addEventListener(

/* =========================
   USER SEARCH
========================= */

let searchTimer = null;

$("searchInput").addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    searchTimer =
      setTimeout(
        searchUsers,
        350
      );

  }
);


async function searchUsers(){

  const term =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  const resultBox =
    $("searchResults");

  resultBox.innerHTML = "";


  if(!term) return;


  try{

    const usersRef =
      collection(db, "users");


    const snapshot =
      await getDocs(usersRef);


    snapshot.forEach(userDoc => {

      const user =
        userDoc.data();


      if(
        user.uid !== currentUser.uid &&
        (
          (user.username || "")
            .toLowerCase()
            .includes(term)
          ||
          (user.name || "")
            .toLowerCase()
            .includes(term)
        )
      ){

        const item =
          document.createElement("div");

        item.className =
          "user-result";


        item.innerHTML = `
          <img class="avatar"
               src="${avatarURL(user)}">

          <div class="user-info">
            <div class="user-name">
              ${escapeHTML(user.name || "User")}
            </div>

            <div class="user-username">
              @${escapeHTML(user.username || "")}
            </div>
          </div>
        `;


        item.addEventListener(
          "click",
          () => {

            $("searchInput").value = "";

            resultBox.innerHTML = "";

            openChat(user);

          }
        );


        resultBox.appendChild(item);

      }

    });

  }catch(error){

    console.error(error);

  }

}


/* =========================
   CHAT LIST
========================= */

function loadChats(){

  if(unsubscribeChats){
    unsubscribeChats();
  }


  const chatsRef =
    collection(db, "chats");


  const q =
    query(
      chatsRef,
      where(
        "members",
        "array-contains",
        currentUser.uid
      )
    );


  unsubscribeChats =
    onSnapshot(
      q,
      snapshot => {

        const chats = [];

        snapshot.forEach(docSnap => {

          chats.push({
            id:docSnap.id,
            ...docSnap.data()
          });

        });


        chats.sort(
          (a,b) => {

            const aTime =
              a.updatedAt?.seconds || 0;

            const bTime =
              b.updatedAt?.seconds || 0;

            return bTime - aTime;

          }
        );


        renderChatList(chats);

      },
      error => {

        console.error(error);

      }
    );

}


/* =========================
   RENDER CHAT LIST
========================= */

function renderChatList(chats){

  const list =
    $("chatList");

  list.innerHTML = "";


  if(chats.length === 0){

    list.innerHTML = `
      <div style="
        padding:20px;
        color:var(--muted);
        text-align:center;
      ">
        No chats yet.<br>
        Search a username above.
      </div>
    `;

    return;

  }


  chats.forEach(chat => {

    const otherUid =
      chat.members.find(
        uid => uid !== currentUser.uid
      );


    if(!otherUid) return;


    const name =
      chat.userNames?.[otherUid]
      || "User";


    const username =
      chat.userUsernames?.[otherUid]
      || "";


    const item =
      document.createElement("div");

    item.className =
      "chat-item";


    const avatar =
      document.createElement("img");

    avatar.className =
      "avatar";


    const info =
      document.createElement("div");

    info.className =
      "user-info";


    info.innerHTML = `
      <div class="user-name">
        ${escapeHTML(name)}
      </div>

      <div class="chat-preview">
        ${escapeHTML(
          chat.lastMessage ||
          "Start chatting"
        )}
      </div>
    `;


    avatar.src =
      "https://ui-avatars.com/api/?name=" +
      encodeURIComponent(name) +
      "&background=2563eb&color=fff";


    item.appendChild(avatar);

    item.appendChild(info);


    item.addEventListener(
      "click",
      async () => {

        try{

          const userSnap =
            await getDoc(
              doc(
                db,
                "users",
                otherUid
              )
            );


          if(userSnap.exists()){

            openChat(
              userSnap.data()
            );

          }else{

            openChat({
              uid:otherUid,
              name:name,
              username:username
            });

          }

        }catch(error){

          console.error(error);

        }

      }
    );


    list.appendChild(item);

  });

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
