<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chatterly</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#2563eb;
  --border:#e5e7eb;
  --mine:#dbeafe;
  --other:#fff;
}

body.dark{
  --bg:#0f172a;
  --card:#111827;
  --text:#f9fafb;
  --muted:#9ca3af;
  --primary:#3b82f6;
  --border:#263247;
  --mine:#1e3a5f;
  --other:#172033;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* GET STARTED */

#welcomePage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.welcome-card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  padding:40px 28px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.logo{
  width:78px;
  height:78px;
  margin:0 auto 20px;
  border-radius:23px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
}

.welcome-card h1{
  font-size:32px;
  margin-bottom:10px;
}

.welcome-card p{
  color:var(--muted);
  line-height:1.5;
  margin-bottom:28px;
}

.start-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  background:var(--primary);
  color:white;
  font-weight:bold;
  font-size:16px;
}

.start-btn:hover{
  opacity:.9;
}

.small{
  margin-top:15px;
  color:var(--muted);
  font-size:12px;
}


/* PROFILE */

#profilePage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.profile-card{
  width:100%;
  max-width:430px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
}

.profile-card h2{
  margin-bottom:8px;
}

.profile-card p{
  color:var(--muted);
  margin-bottom:20px;
}

.profile-photo{
  width:85px;
  height:85px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 20px;
}

.input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  background:var(--bg);
  color:var(--text);
}

.primary-btn,
.skip-btn{
  width:100%;
  padding:13px;
  border-radius:11px;
  font-weight:bold;
}

.primary-btn{
  border:0;
  background:var(--primary);
  color:#fff;
}

.skip-btn{
  margin-top:9px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}

.error{
  color:#ef4444;
  font-size:13px;
  margin:5px 0 10px;
}


/* APP */

#appPage{
  height:100vh;
  display:flex;
}

.sidebar{
  width:340px;
  background:var(--card);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:17px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:23px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
}

.search-box{
  padding:12px;
  border-bottom:1px solid var(--border);
}

.search-input{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--bg);
  color:var(--text);
}

.search-results{
  max-height:220px;
  overflow:auto;
}

.user-result{
  padding:12px 5px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.user-result:hover{
  background:var(--bg);
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.chat-list{
  flex:1;
  overflow:auto;
}

.chat-item{
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.chat-item:hover{
  background:var(--bg);
}

.chat-preview{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}


/* CHAT */

.chat-area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:70px;
  padding:12px 17px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.chat-info{
  flex:1;
}

.chat-name{
  font-weight:bold;
}

.status{
  color:#22c55e;
  font-size:12px;
  margin-top:3px;
}

.back-btn{
  display:none;
}

.messages{
  flex:1;
  overflow:auto;
  padding:20px;
  background:var(--bg);
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
}

.message-row{
  display:flex;
  margin-bottom:10px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:75%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--other);
}

.message-row.mine .message{
  background:var(--mine);
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
}

.message-time{
  font-size:10px;
  color:var(--muted);
  text-align:right;
  margin-top:5px;
}

.reply-box{
  border-left:3px solid var(--primary);
  padding-left:7px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px;
}

.reaction{
  font-size:12px;
  margin-top:3px;
}

.message-actions{
  display:flex;
  gap:5px;
  margin-top:5px;
}

.message-actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
}

.composer{
  display:flex;
  gap:8px;
  padding:12px;
  background:var(--card);
  border-top:1px solid var(--border);
}

.message-input{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:var(--bg);
  color:var(--text);
}

.send-btn{
  width:50px;
  border:0;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-size:19px;
}


/* MOBILE */

@media(max-width:700px){

  .sidebar{
    width:100%;
  }

  .chat-area{
    display:none;
  }

  #appPage.chat-open .sidebar{
    display:none;
  }

  #appPage.chat-open .chat-area{
    display:flex;
  }

  .back-btn{
    display:block;
  }

  .message{
    max-width:85%;
  }
}
</style>
</head>

<body>


<!-- WELCOME -->

<section id="welcomePage">

  <div class="welcome-card">

    <div class="logo">C</div>

    <h1>Welcome to Chatterly</h1>

    <p>
      Chat with people in real time.
      No account setup required to get started.
    </p>

    <button id="getStarted" class="start-btn">
      Get Started
    </button>

    <div class="small">
      You can create your profile later.
    </div>

  </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="hidden">

  <div class="profile-card">

    <img id="profilePhoto" class="profile-photo">

    <h2>Create your profile</h2>

    <p>
      This is optional. You can skip it and use Chatterly now.
    </p>

    <input
      id="displayName"
      class="input"
      placeholder="Your name"
      maxlength="40"
    >

    <input
      id="username"
      class="input"
      placeholder="Username"
      maxlength="20"
    >

    <div id="profileError" class="error"></div>

    <button id="saveProfile" class="primary-btn">
      Save Profile
    </button>

    <button id="skipProfile" class="skip-btn">
      Skip
    </button>

  </div>

</section>


<!-- APP -->

<section id="appPage" class="hidden">

  <aside class="sidebar">

    <div class="sidebar-header">

      <div class="brand">
        Chatterly
      </div>

      <div class="header-actions">

        <button id="darkMode" class="icon-btn">
          🌙
        </button>

        <button id="logout" class="icon-btn">
          ↪
        </button>

      </div>

    </div>


    <div class="search-box">

      <input
        id="searchInput"
        class="search-input"
        placeholder="Search username..."
      >

      <div id="searchResults" class="search-results"></div>

    </div>


    <div id="chatList" class="chat-list"></div>

  </aside>


  <main class="chat-area">

    <div class="chat-header">

      <button id="backBtn" class="icon-btn back-btn">
        ←
      </button>

      <img id="chatAvatar" class="avatar">

      <div class="chat-info">

        <div id="chatName" class="chat-name">
          Select a chat
        </div>

        <div id="chatStatus" class="status"></div>

      </div>

    </div>


    <div id="messages" class="messages">

      <div class="empty">

        <div>
          <h2>Welcome 👋</h2>
          <p>Search for someone to start chatting.</p>
        </div>

      </div>

    </div>


    <div class="composer">

      <input
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendBtn" class="send-btn">
        ➤
      </button>

    </div>

  </main>

</section>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   YOUR FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDitPl7OUTOxzRtiaFBjTKFdB1T_YqLFM4",

  authDomain:
    "catterfly-64309.firebaseapp.com",

  projectId:
    "catterfly-64309",

  storageBucket:
    "catterfly-64309.firebasestorage.app",

  messagingSenderId:
    "875167607108",

  appId:
    "1:875167607108:web:49cab44656f7467bb64f11",

  measurementId:
    "G-JML2V6YEDS"
};


/* =========================
   FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentChatUser = null;

let unsubscribeMessages = null;
let unsubscribeChats = null;


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function showPage(id){

  $("welcomePage")
    .classList.add("hidden");

  $("profilePage")
    .classList.add("hidden");

  $("appPage")
    .classList.add("hidden");

  $(id)
    .classList.remove("hidden");
}


function avatarURL(user){

  if(user && user.photoURL){
    return user.photoURL;
  }

  const name =
    user?.name ||
    user?.displayName ||
    "User";

  return (
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(name) +
    "&background=2563eb&color=fff"
  );
}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   GET STARTED
========================= */

$("getStarted")
.addEventListener("click", async () => {

  $("getStarted").disabled = true;

  $("getStarted").textContent =
    "Starting...";

  try{

    /*
      Firebase creates an anonymous
      account automatically.
      User does not need to enter
      email, password or phone.
    */

    await signInAnonymously(auth);

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Could not start Chatterly."
    );

    $("getStarted").disabled = false;

    $("getStarted").textContent =
      "Get Started";
  }

});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      showPage("welcomePage");

      return;
    }

    currentUser = user;

    await setupUser();

  }
);


/* =========================
   USER SETUP
========================= */

async function setupUser(){

  try{

    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );

    const snap =
      await getDoc(userRef);


    if(snap.exists()){

      currentProfile =
        snap.data();

      showPage("appPage");

      loadChats();

      return;
    }


    /*
      New anonymous user:
      Give an automatic profile.
    */

    const username =
      "user_" +
      currentUser.uid
        .substring(0,8)
        .toLowerCase();


    const profile = {

      uid:
        currentUser.uid,

      name:
        "Chatterly User",

      username:
        username,

      photoURL:
        "",

      anonymous:
        true,

      createdAt:
        serverTimestamp()

    };


    await setDoc(
      userRef,
      profile
    );


    await setDoc(
      doc(
        db,
        "usernames",
        username
      ),
      {
        uid:
          currentUser.uid,

        username:
          username
      }
    );


    currentProfile =
      profile;

    showPage("appPage");

    loadChats();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "User setup failed."
    );

  }

}


/* =========================
   PROFILE SAVE
========================= */

$("saveProfile")
.addEventListener("click", async () => {

  const name =
    $("displayName")
      .value
      .trim();

  const username =
    $("username")
      .value
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");


  if(!name){

    $("profileError").textContent =
      "Enter your name.";

    return;
  }


  if(username.length < 3){

    $("profileError").textContent =
      "Username must contain at least 3 characters.";

    return;
  }


  try{

    const usernameRef =
      doc(
        db,
        "usernames",
        username
      );


    const existing =
      await getDoc(usernameRef);


    if(existing.exists()){

      $("profileError").textContent =
        "Username already exists.";

      return;
    }


    const profile = {

      uid:
        currentUser.uid,

      name:
        name,

      username:
        username,

      photoURL:
        "",

      anonymous:
        true,

      updatedAt:
        serverTimestamp()

    };


    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      profile,
      {
        merge:true
      }
    );


    await setDoc(
      usernameRef,
      {
        uid:
          currentUser.uid,

        username:
          username
      }
    );


    currentProfile =
      profile;

    showPage("appPage");

    loadChats();

  }catch(error){

    console.error(error);

    $("profileError").textContent =
      error.message;

  }

});


/* =========================
   PROFILE SKIP
========================= */

$("skipProfile")
.addEventListener("click", () => {

  showPage("appPage");

  loadChats();

});


/* =========================
   CHAT ID
========================= */

function makeChatId(a,b){

  return [a,b]
    .sort()
    .join("_");

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(user){

  currentChatUser =
    user;

  currentChatId =
    makeChatId(
      currentUser.uid,
      user.uid
    );


  try{

    await setDoc(
      doc(
        db,
        "chats",
        currentChatId
      ),
      {

        members:[
          currentUser.uid,
          user.uid
        ],

        userNames:{
          [currentUser.uid]:
            currentProfile?.name ||
            "User",

          [user.uid]:
            user.name ||
            "User"
        },

        userUsernames:{
          [currentUser.uid]:
            currentProfile?.username ||
            "",

          [user.uid]:
            user.username ||
            ""
        },

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    $("chatName").textContent =
      user.name ||
      "User";

    $("chatStatus").textContent =
      "Available";

    $("chatAvatar").src =
      avatarURL(user);


    $("messages").innerHTML = "";

    listenMessages();


    $("appPage")
      .classList.add("chat-open");

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Could not open chat."
    );

  }

}


/* =========================
   MESSAGES LISTENER
========================= */

function listenMessages(){

  if(unsubscribeMessages){
    unsubscribeMessages();
  }


  const ref =
    collection(
      db,
      "chats",
      currentChatId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot => {

        $("messages").innerHTML = "";


        if(snapshot.empty){

          $("messages").innerHTML = `
            <div class="empty">
              <div>
                <h3>No messages yet</h3>
                <p>Send the first message 👋</p>
              </div>
            </div>
          `;

          return;
        }


        snapshot.forEach(
          message => {

            renderMessage(
              message.id,
              message.data()
            );

          }
        );


        $("messages").scrollTop =
          $("messages").scrollHeight;

      },
      error => {

        console.error(error);

      }
    );

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(id,data){

  const mine =
    data.senderId ===
    currentUser.uid;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (mine ? "mine" : "");


  const box =
    document.createElement("div");

  box.className =
    "message";


  if(data.replyText){

    const reply =
      document.createElement("div");

    reply.className =
      "reply-box";

    reply.textContent =
      data.replyText;

    box.appendChild(reply);

  }


  const text =
    document.createElement("div");

  text.className =
    "message-text";

  text.textContent =
    data.text || "";

  box.appendChild(text);


  if(data.reaction){

    const reaction =
      document.createElement("div");

    reaction.className =
      "reaction";

    reaction.textContent =
      "❤️ " +
      data.reaction;

    box.appendChild(reaction);

  }


  const time =
    document.createElement("div");

  time.className =
    "message-time";


  if(data.createdAt){

    try{

      time.textContent =
        new Date(
          data.createdAt.seconds *
          1000
        ).toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }catch{

      time.textContent = "";

    }

  }


  box.appendChild(time);


  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";


  const heart =
    document.createElement("button");

  heart.textContent =
    "❤️";

  heart.onclick =
    () => toggleReaction(
      id,
      data
    );


  const reply =
    document.createElement("button");

  reply.textContent =
    "Reply";

  reply.onclick =
    () => {

      $("messageInput").value =
        "> " +
        (data.text || "") +
        "\n";

      $("messageInput").focus();

    };


  actions.appendChild(heart);

  actions.appendChild(reply);


  if(mine){

    const del =
      document.createElement("button");

    del.textContent =
      "Delete";

    del.onclick =
      () => deleteMessage(id);

    actions.appendChild(del);

  }


  box.appendChild(actions);

  row.appendChild(box);

  $("messages").appendChild(row);

}


/* =========================
   SEND
========================= */

async function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text ||
     !currentChatId){

    return;
  }


  input.value = "";


  try{

    await addDoc(
      collection(
        db,
        "chats",
        currentChatId,
        "messages"
      ),
      {

        text:
          text,

        senderId:
          currentUser.uid,

        senderName:
          currentProfile?.name ||
          "User",

        createdAt:
          serverTimestamp()

      }
    );


    await updateDoc(
      doc(
        db,
        "chats",
        currentChatId
      ),
      {

        lastMessage:
          text,

        updatedAt:
          serverTimestamp()

      }
    );

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Message failed."
    );

  }

}


$("sendBtn")
.addEventListener(
  "click",
  sendMessage
);


$("messageInput")
.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

/* =========================
   SEARCH
========================= */

let searchTimer;


$("searchInput")
.addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    searchTimer =
      setTimeout(
        searchUsers,
        350
      );

  }
);


async function searchUsers(){

  const term =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  const box =
    $("searchResults");

  box.innerHTML = "";


  if(!term) return;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    snapshot.forEach(
      userDoc => {

        const user =
          userDoc.data();


        if(
          user.uid !==
          currentUser.uid
          &&
          (
            (user.username || "")
              .toLowerCase()
              .includes(term)
            ||
            (user.name || "")
              .toLowerCase()
              .includes(term)
          )
        ){

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "user-result";


          item.innerHTML = `
            <img
              class="avatar"
              src="${avatarURL(user)}"
            >

            <div class="user-info">

              <div class="user-name">
                ${escapeHTML(
                  user.name ||
                  "User"
                )}
              </div>

              <div class="user-username">
                @${escapeHTML(
                  user.username ||
                  ""
                )}
              </div>

            </div>
          `;


          item.onclick =
            () => {

              box.innerHTML = "";

              $("searchInput")
                .value = "";

              openChat(user);

            };


          box.appendChild(item);

        }

      }
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================
   CHAT LIST
========================= */

function loadChats(){

  if(unsubscribeChats){
    unsubscribeChats();
  }


  const q =
    query(
      collection(
        db,
        "chats"
      ),
      where(
        "members",
        "array-contains",
        currentUser.uid
      )
    );


  unsubscribeChats =
    onSnapshot(
      q,
      snapshot => {

        const chats = [];


        snapshot.forEach(
          item => {

            chats.push({
              id:item.id,
              ...item.data()
            });

          }
        );


        chats.sort(
          (a,b) =>
            (
              b.updatedAt?.seconds ||
              0
            ) -
            (
              a.updatedAt?.seconds ||
              0
            )
        );


        renderChatList(chats);

      },
      error => {

        console.error(error);

      }
    );

}


/* =========================
   RENDER CHAT LIST
========================= */

function renderChatList(chats){

  const list =
    $("chatList");

  list.innerHTML = "";


  if(chats.length === 0){

    list.innerHTML = `
      <div style="
        padding:20px;
        text-align:center;
        color:var(--muted);
      ">
        No chats yet.<br>
        Search a username above.
      </div>
    `;

    return;
  }


  chats.forEach(
    chat => {

      const otherUid =
        chat.members.find(
          uid =>
            uid !==
            currentUser.uid
        );


      if(!otherUid) return;


      const name =
        chat.userNames?.[otherUid]
        || "User";


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "chat-item";


      const img =
        document.createElement(
          "img"
        );

      img.className =
        "avatar";

      img.src =
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name) +
        "&background=2563eb&color=fff";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "user-info";


      info.innerHTML = `
        <div class="user-name">
          ${escapeHTML(name)}
        </div>

        <div class="chat-preview">
          ${escapeHTML(
            chat.lastMessage ||
            "Start chatting"
          )}
        </div>
      `;


      item.appendChild(img);

      item.appendChild(info);


      item.onclick =
        async () => {

          const snap =
            await getDoc(
              doc(
                db,
                "users",
                otherUid
              )
            );


          if(snap.exists()){

            openChat(
              snap.data()
            );

          }

        };


      list.appendChild(item);

    }
  );

}

$("darkMode")
.addEventListener(
  "click",
  () => {

    document.body
      .classList
      .toggle("dark");


    const dark =
      document.body
        .classList
        .contains("dark");


    localStorage.setItem(
      "chatterlyDark",
      dark ? "1" : "0"
    );


    $("darkMode").textContent =
      dark ? "☀️" : "🌙";

  }
);


if(
  localStorage.getItem(
    "chatterlyDark"
  ) === "1"
){

  document.body
    .classList
    .add("dark");

  $("darkMode").textContent =
    "☀️";

}
